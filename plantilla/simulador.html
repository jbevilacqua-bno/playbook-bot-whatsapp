<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador del bot</title>
<style>
  :root { --wa-bg:#efeae2; --wa-verde:#d9fdd3; --wa-barra:#008069; --texto:#111b21; --gris:#667781; --borde:#e2e8f0; --fondo:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--texto); background:var(--fondo); }
  .wrap { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:24px; max-width:1100px; margin:24px auto; padding:0 16px; }
  @media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
  .phone { border:8px solid #1b1f24; border-radius:22px; overflow:hidden; background:var(--wa-bg); display:flex; flex-direction:column; height:680px; max-height:85vh; }
  .barra { background:var(--wa-barra); color:#fff; padding:12px 14px; font-weight:600; }
  .barra small { display:block; font-weight:400; opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .m { max-width:82%; padding:7px 10px; border-radius:8px; white-space:pre-wrap; box-shadow:0 1px .5px rgba(0,0,0,.13); background:#fff; align-self:flex-start; }
  .m.yo { background:var(--wa-verde); align-self:flex-end; }
  .ops { display:flex; flex-wrap:wrap; gap:6px; align-self:flex-start; max-width:90%; }
  .ops button { background:#fff; border:1px solid #c9d3cf; color:#0b7a68; border-radius:16px; padding:6px 12px; cursor:pointer; font:inherit; }
  form { display:flex; gap:6px; padding:8px; background:#f0f2f5; }
  input { flex:1; border:0; border-radius:20px; padding:10px 14px; font:inherit; }
  form button { border:0; border-radius:50%; width:42px; background:var(--wa-barra); color:#fff; font-size:18px; cursor:pointer; }
  .lado h2 { margin:0 0 8px; font-size:16px; }
  .acciones { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .acciones button { border:1px solid var(--borde); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
  pre { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:12px; overflow:auto; font-size:13px; }
  .estado { color:var(--gris); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="barra">Bot de WhatsApp<small id="estado">simulador · mismo motor que WhatsApp</small></div>
    <div id="chat"></div>
    <form id="form"><input id="msg" autocomplete="off" placeholder="Escribe como lo haría un cliente"><button aria-label="Enviar">➤</button></form>
  </div>
  <div class="lado">
    <div class="acciones">
      <button id="nueva" type="button">Nueva conversación</button>
    </div>
    <h2>Ficha para el SDR</h2>
    <pre id="ficha">(vacía)</pre>
    <p class="estado">Cada conversación se guarda en la carpeta <b>conversaciones</b> de la compu que corre el simulador. Usa datos de prueba, no datos reales de clientes.</p>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const llave = new URLSearchParams(location.search).get("llave");
  let id = Date.now().toString(36), nueva = true;
  function burbuja(texto, yo) { const d = document.createElement("div"); d.className = "m" + (yo ? " yo" : ""); d.textContent = texto; $("chat").appendChild(d); d.scrollIntoView({ block: "end" }); }
  async function enviar(texto, visible) {
    if (visible !== false) burbuja(visible || texto, true);
    document.querySelectorAll(".ops").forEach(o => o.remove());
    const r = await fetch("api/simular" + (llave ? "?llave=" + encodeURIComponent(llave) : ""), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, texto, nueva }) });
    nueva = false;
    const j = await r.json();
    if (j.error) { burbuja("Error del servidor: " + j.error); return; }
    $("estado").textContent = "simulador · IA " + (j.ia_activa ? "activa" : "apagada (contestan las reglas)");
    for (const m of j.mensajes) {
      burbuja(m.texto);
      if (m.opciones) { const o = document.createElement("div"); o.className = "ops";
        m.opciones.forEach(op => { const b = document.createElement("button"); b.type = "button"; b.textContent = op.titulo; b.onclick = () => enviar(op.id, op.titulo); o.appendChild(b); });
        $("chat").appendChild(o); o.scrollIntoView({ block: "end" }); }
    }
    $("ficha").textContent = JSON.stringify(j.ficha, null, 2);
  }
  $("form").onsubmit = e => { e.preventDefault(); const t = $("msg").value.trim(); if (!t) return; $("msg").value = ""; enviar(t); };
  $("nueva").onclick = () => { id = Date.now().toString(36); nueva = true; $("chat").innerHTML = ""; $("ficha").textContent = "(vacía)"; enviar("Hola"); };
  enviar("Hola");
</script>
</body>
</html>
